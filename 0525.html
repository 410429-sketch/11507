<html>
<head>
    <title>0525-宇宙射擊遊戲</title>
    <style>
    @keyframes bg_move{
        0%{background-position:0px;}
        100%{background-position:216px;}
    }
    #universe{
        width: 600px;
        height: 600px;
        background: url("C:\Users\USER\Desktop\11507\bg_stars.jpg");
        animation: bg_move 2s linear infinite;
        position: relative;
    }
    #ship{ width: 40px;
        height: 60;
        position: absolute;
        top:540px;
        left: 280;
    }
    .ufo{
        width: 60px;
        height: 40px;
        position: absolute;
    }
    </style>
     <script>
        function ship_move{
            if(ship.way["ArrowUp"]&& ship.pos.y>0)ship.pos.y--
            else if(ship.way["ArrowDowe"]&& ship.pos.y<540)ship.pos.y++
            else if(ship.way["ArrowLeft"]&& ship.pos.x<540)ship.pos.x--
            else if(ship.way["ArrowRight"]&& ship.pos.x<540)ship.pos.x++
            ship.style.top=ship.ship,pos.y + "px"
            ship.style.left=ship.ship,pos.x + "px"
        }
        function bullet_move(b){
            if(b.pos.y<0){
                clearInterval(b.move)
                b.remove()
            }else{
                b.pos.y--
                showPos
            }
        }
        function shoot(){
            var b=document.createElement("div")
            b.className="bullet"
            b.pos={x:ship.pos.x+18,y:ship.y-6}
            b.move=setInterval(bullet_move,5,b)
            document.getElementById("unmierse").appendChild(b)
        }
        function game_start {

        }
        function game_stop{
            
        }
        function game_init{
            ship=document.getElementById("ship")
            ship.pos={x:280,y:540}
            ship.way={"ArrowLeft":0,"ArrowRight":0,"ArrowDowe":0,"ArrowUp":0}
            ship.ship_move=setInterval(ship_move,5)
        }
        function mykeydowe{
            event.preventDefault()
            if(Object.key(ship.way).includes(event.key)){
                ship.way[event.key]=1
            }else if(event.key==" "){
                shoot()
            }
        }
        function mykeyup{
             event.preventDefault()
            if(Object.key(ship.way).includes(event.key)){
                ship.way[event.key]=0
            }
        }
     </script>
     </head>
<body>
    <div id="universe">
        <img id="ship" src="C:\Users\USER\Desktop\11507\ship.png">
    </div>
    
</body>
</html>
